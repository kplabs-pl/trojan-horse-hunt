
# Trigger settings
trigger:
  trigger_pth: "triggers/trigger_model_13/"
  injection_every: 400
  inject_start: 200
  # poisoned_channels:
  #   - channel_45
  #   - channel_46

# Poisoned Model settings
poisoned_model:
  clean_model_pth: "clean_model/clean_model.pt"
  save_pth: "experiments/experiment_consecutive_triangles/"
  model_file_name: "poisoned_model"
  test_size: 0.085
  val_size: 0.25
  n_epochs: 100
  early_stopping_patience: 20
  early_stopping_min_delta: 0
  stopping_threshold: 0.000006

# Probing settings
probing:
  probing_channels:
    - channel_44
    - channel_45
    - channel_46
  spike_value: 0.9
  spike_duration: 10


# Baseline Optimization settings
optimization:
  lambda_reg: 1 # trigger loss parameter
  alpha_reg: 1.5 # tracking loss parameter
  beta_reg: 2 # difference loss parameter
  insert_pos: 200
  epochs: 200
  target_preds_diff: 2.5
  target_context_pred_diff: 4
  target_reg: 0.075

# Data settings
clean_model_data:
  preprocessed_data_pth: "data/"
