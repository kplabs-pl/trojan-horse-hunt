name: Reproduce

# Deterministic checks only; model training is out of scope (see REPRODUCIBILITY.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false          # none of these checks read a git-LFS file

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the packages these checks need
        run: |
          python -m pip install --upgrade pip
          pip install "numpy" "pandas==2.2.3" "matplotlib==3.10.0" "scipy" "pyyaml" "autorank==1.3.0"

      - name: Verify reproducibility
        run: python ci/verify_reproducibility.py

      - name: Confirm no tracked file was modified
        run: |
          git diff --exit-code || {
            echo "::error::running the package modified tracked files"; exit 1; }
