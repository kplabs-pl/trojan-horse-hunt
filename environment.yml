name: "trojan-horse-hunt"
channels:
  - defaults
  - conda-forge

dependencies:
  - python==3.11.*
  - pip>=20

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      - torchaudio==2.6.0
      - matplotlib==3.10.0
      - pandas==2.2.3
      - seaborn==0.13.2
      - darts==0.33.0
      - scikit-learn==1.6.1
      - autorank==1.3.0  # CD diagram

      # imported by the code, or required at runtime, but only pulled in transitively
      - pyyaml==6.0.3
      - pyarrow==25.0.1          # pandas parquet engine
      - scipy==1.17.1
      - tqdm==4.70.0
      - joblib==1.5.3
      - pytorch-lightning==2.6.5
      - xarray==2026.7.0         # required to unpickle the distributed TimeSeries
